services:
  music-queue:
    build:
      context: ./music-queue
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./music-queue/backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      GENRE_SERVICE_URL: http://genre-service:3001
      TRUSTED_PROXY_IP: 172.30.50.10
    depends_on:
      genre-service:
        condition: service_healthy
    restart: unless-stopped

  genre-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-google/gemma-4-e2b}
      LM_STUDIO_API_TOKEN: ${LM_STUDIO_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://music-queue:3000
    depends_on:
      - music-queue
    networks:
      default:
        ipv4_address: 172.30.50.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.50.0/24